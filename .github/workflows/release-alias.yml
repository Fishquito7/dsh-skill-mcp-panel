name: Publish stable tarball alias

# 每个 release 都必须带上「无版本命名」的资产 dsh-skill-mcp-panel.tgz：
#   https://github.com/<owner>/<repo>/releases/latest/download/dsh-skill-mcp-panel.tgz
# 这条稳定链接是 README 推荐的安装方式，也是插件 `dsh-panel update` / 设置页
# 「检查更新」的默认更新通道（见 src/version.ts 的 INSTALL_SPEC）。
# 一旦某个 release 忘了传它，这条链接立刻 404、自动更新就会失败——所以由 CI 自动补。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add the alias to (e.g. v2.1.0)
        required: true

permissions:
  contents: write

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Re-upload this release's tarball under the version-less name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          ASSET_NAME: dsh-skill-mcp-panel.tgz
        run: |
          set -euo pipefail
          versioned="dsh-skill-mcp-panel-${TAG#v}.tgz"
          gh release download "$TAG" --pattern "$versioned" --output "$ASSET_NAME" --clobber
          gh release upload "$TAG" "$ASSET_NAME" --clobber
          echo "uploaded $ASSET_NAME to $TAG (from $versioned)"
